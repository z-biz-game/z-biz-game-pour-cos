<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101217">
<meta name="description" content="倒水量：用几只没刻度的桶量出指定的数。每一关的最少次数都是广度优先搜索量出来的，可解性由数论定理独立判定。">
<link rel="icon" href="data:,">
<title>倒水量 · POUR</title>
<link rel="stylesheet" href="css/game.css">

  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<header class="topbar">
  <h1 class="brand"><span class="brand-mark">◺</span>倒水量<small>POUR</small></h1>
  <nav class="modes" id="modes" aria-label="模式">
    <button type="button" data-mode="campaign">闯关</button>
    <button type="button" data-mode="daily">每日</button>
    <button type="button" data-mode="random">随机</button>
  </nav>
  <p class="totals" id="totals"></p>
</header>

<main class="stage">
  <section class="board">
    <canvas id="bench" aria-label="倒水操作台"></canvas>
    <p class="hint-line" id="hintline"></p>
    <div class="curtain" id="curtain" hidden>
      <div class="curtain-card">
        <p class="stars" id="stars"></p>
        <h2 id="verdict"></h2>
        <p class="tally" id="tally"></p>
        <div class="curtain-actions">
          <button type="button" id="again">再来一次</button>
          <button type="button" id="next" class="primary">下一题</button>
        </div>
      </div>
    </div>
  </section>

  <aside class="panel">
    <p class="crumbs" id="crumbs"></p>
    <dl class="readout" id="readout"></dl>
    <table class="caps" id="caps">
      <thead><tr><th>桶</th><th>容量</th><th>当前</th><th>目标</th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="theorem" id="theorem"></p>
    <div class="controls">
      <button type="button" id="undo">撤销</button>
      <button type="button" id="hint">提示</button>
      <button type="button" id="restart">重开</button>
      <button type="button" id="share">分享</button>
      <button id="btn-fullscreen" type="button" aria-pressed="false" title="全屏（F）">全屏</button>
    </div>
    <p class="linkline" id="linkline"></p>
    <div class="log" id="log"></div>
    <div class="shelf" id="shelf"></div>
    <details class="about">
      <summary>这一关的数字从哪来</summary>
      <p>每一题的<b>最少次数</b>都由 <code>js/core/solve.js</code> 的广度优先搜索在 ∏(cᵢ+1) 状态图上量出：一次拖动不论倒多少水都算一步。<b>有没有解</b>则由 <code>js/core/theorem.js</code> 的数论定理（Bézout）独立判定——两者相互印证，谁也不给谁打分。关卡来自 <code>tools/bake.mjs</code>：构建期跑 <code>js/core/make.js</code> 出题并复验，浏览器本身既不生成也不搜索。</p>
      <p class="save">成绩只存在这台设备的浏览器里。<button type="button" id="wipe">清空存档</button></p>
    </details>
  </aside>
</main>

<p class="toast" id="toast" hidden></p>
<script type="module" src="js/main.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
