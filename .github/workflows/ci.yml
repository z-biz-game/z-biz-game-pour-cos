name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The model, the search, the number theory and the shipped pool are all plain ES modules:
  # this job needs no install step, because `dependencies` and `devDependencies` are both {}
  # (test/shape.test.mjs fails the build if that ever stops being true).
  #
  # Two rows are the reason the job exists:
  #   * test/bezout.test.mjs — the solvency verdict is re-derived by a hand-written subtractive
  #     Euclid and by an independent reachable-set walk, and cross-checked against the BFS on
  #     606 / 525 / 486 cases;
  #   * test/library.test.mjs — re-solves every line of js/data/lots.js from its serialised
  #     spec, so a hand-edited par, a stale bake or a deleted puzzle fails the build.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keep this glob list byte-identical to `npm run check` in package.json — shape.test.mjs
      # asserts the two cover the same files, and a file that only CI checks is a file nobody
      # checks locally.
      - name: Syntax
        run: npm run check
      - name: Suites
        run: npm run unit
      # The difficulty leg. `npm run balance` is the rig that prints the accept rates and the
      # rejection ledger README quotes, and nothing at merge time ever ran it -- the numbers were
      # guarded by a human remembering the command. Measured here: rc=0 in 20.5s (script self-reports
      # 20.3s), which is well under a minute, so CI runs the full default sample, the same command
      # locals type. The rig's only red condition is a re-solve MISMATCH (process.exitCode = 1);
      # a load-dependent TIER_MS truncation still prints cut=yes and stays green on purpose.
      - name: Balance (难度台架)
        run: npm run balance
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

  # The page is only proven by driving a real Chrome with real pointer events: the bucket hit
  # test, the "a move that changes nothing costs nothing" rule, the clamped over-drag and the
  # save file all live behind `window.pour`. SKIP_UNIT=1 because the job above already ran them.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless playtest
        env:
          SKIP_UNIT: 1
          WD_TIMEOUT: 240
        run: bash tools/verify.sh
